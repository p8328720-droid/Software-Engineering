services:
  db:
    image: mariadb:lts-noble
    environment:
      MARIADB_USER: user
      MARIADB_PASSWORD: password
      MARIADB_DATABASE: laravel
      MARIADB_ROOT_PASSWORD: password
      MARIADB_PORT: 3306
    networks:
      - laravel

  app:
    image: ghcr.io/p8328720-droid/software-engineering:latest
    environment:
      - LOG_CHANNEL=stack
      - LOG_LEVEL=debug
      - DB_HOST=db
      - DB_DATABASE=laravel
      - DB_USERNAME=user
      - DB_PASSWORD=password
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - REDIS_CLIENT=phpredis
      - REDIS_HOST=redis
    depends_on:
      - db
    # Trik Gaib: Docker otomatis nyalin folder public dari dalam image lu ke volume ini
    volumes:
      - asset_data:/var/www/app/public
    networks:
      - laravel

  web:
    image: nginx:alpine # Murni polosan dari Docker Hub, gak pake build!
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - asset_data:/var/www/app/public:ro # Nginx numpang baca assets dari volume internal
    depends_on:
      - app
    networks:
      - laravel

  redis:
    image: redis:alpine
    networks:
      - laravel

volumes:
  asset_data:
networks:
  laravel:
    driver: bridge